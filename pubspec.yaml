name: teacher_app
description: Control de clases, horas y finanzas para profesores autónomos
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Base de datos local (offline-first)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Navegación
  go_router: ^14.1.4

  # Calendario y recurrencia
  table_calendar: ^3.1.2
  rrule: ^0.2.6

  # Gráficas
  fl_chart: ^0.68.0

  # Conectividad (preparado para sync futuro)
  connectivity_plus: ^6.0.3

  # UI utilidades
  intl: ^0.20.0
  flutter_slidable: ^3.1.0
  shimmer: ^3.0.0

  # UUID para generación de IDs
  uuid: ^4.4.0

  # Selector de color libre
  flutter_colorpicker: ^1.1.0

  # Persistencia de preferencias (tema)
  shared_preferences: ^2.3.0

  # Almacenamiento seguro de credenciales
  flutter_secure_storage: ^9.0.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
