name: Build iOS (Sin Firma)

# Se ejecuta manualmente o cuando se hace push a main/develop
on:
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub
  push:
    branches:
      - master
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.github/**'
      - '!.github/workflows/**'

jobs:
  build-ios:
    name: Compilar App iOS
    runs-on: macos-latest # Runner de macOS de GitHub
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # Ajusta a tu versión
          channel: 'stable'
          cache: true
      
      - name: Verificar versión de Flutter
        run: flutter --version
      
      - name: Instalar dependencias
        run: flutter pub get
      
      - name: Generar código (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Analizar código
        run: flutter analyze
        continue-on-error: true # No fallar si hay warnings
      
      - name: Compilar iOS (sin firma)
        run: |
          cd ios
          flutter build ios --release --no-codesign
      
      - name: Crear IPA (sin firma)
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r app-unsigned.ipa Payload
      
      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: build/ios/iphoneos/app-unsigned.ipa
          retention-days: 30
      
      - name: Resumen
        run: |
          echo "✅ Compilación iOS exitosa"
          echo "📦 IPA generado: build/ios/iphoneos/app-unsigned.ipa"
          echo "⚠️  NOTA: Este IPA NO está firmado. Solo sirve para verificar que compila."
          echo "Para publicar en App Store necesitarás certificados de Apple Developer."
